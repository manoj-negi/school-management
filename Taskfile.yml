version: '3'

vars:
  DB_NAME: school

tasks:
  migrate:
    desc: Run all versioned SQL migrations to create and seed tables
    cmds:
      - |
        for f in migration/migrations/*.sql; do
          echo "Applying $f..."
          psql -d {{.DB_NAME}} -f "$f" > /dev/null
        done

  seed:
    desc: Run the Ent-based Go seed script
    cmds:
      - go run .

  run:
    desc: Run the backend API web server
    cmds:
      - go run . -server

  recreate-db:
    desc: Force drop and recreate the database (terminates other active connections)
    cmds:
      - psql -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '{{.DB_NAME}}' AND pid <> pg_backend_pid();"
      - psql -d postgres -c "DROP DATABASE IF EXISTS {{.DB_NAME}};"
      - psql -d postgres -c "CREATE DATABASE {{.DB_NAME}};"
